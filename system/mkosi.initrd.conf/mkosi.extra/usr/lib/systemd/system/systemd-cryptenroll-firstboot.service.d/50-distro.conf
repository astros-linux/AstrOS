[Service]
UMask=0077
StandardInput=null
StandardOutput=journal
StandardError=inherit
TTYReset=no
ExecStart=
# we use no device argument, cryptenroll picks the root that actually booted
ExecStart=/bin/sh -c 'systemd-cryptenroll | grep -q recovery || systemd-cryptenroll --recovery-key --unlock-tpm2-device=auto >/run/distro-recovery-key'
