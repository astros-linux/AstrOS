[Distribution]
Distribution=arch
Architecture=x86-64

[Build]
ToolsTree=default
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
OutputDirectory=mkosi.output
Format=disk
ImageId=AstrOS-installer
Output=%i_%v_%a
CompressOutput=zstd

[Content]
RootPassword=AstrOS
Hostname=astros-installer
Bootable=yes
Splash=/usr/share/distro/splash.bmp
KernelCommandLine=
  mount.usr=dissect
  rw
  root=tmpfs
  systemd.mask=systemd-firstboot.service
  quiet
  loglevel=3
  SYSTEMD_SULOGIN_FORCE=1
KernelInitrdModules=
  default
  uas
Packages=
  base
  tpm2-tss
  linux
  linux-firmware-atheros
  linux-firmware-broadcom
  linux-firmware-intel
  linux-firmware-mediatek
  linux-firmware-realtek
  linux-firmware-other
  zstd
  libnewt
  btrfs-progs
  dosfstools
  exfatprogs
  e2fsprogs
  networkmanager
  wpa_supplicant
  vim
  gptfdisk
  parted
  less
  bash-completion
  git
  rsync
  efibootmgr
